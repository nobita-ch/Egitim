site_name: Eğitim Materyalleri
site_url: https://nobita-ch.github.io/Egitim/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.footer

extra_css:
  - stylesheets/giris.css

extra_javascript:
  - javascripts/ayarlar.js
  - javascripts/video.js
  - javascripts/giris.js

not_in_nav: |
  /giris.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Ana Sayfa: index.md
  - Yazılım:
    - Python Ders Notları:
        - 1) Girinti, Yorum ve Çok Satırlı İfadeler: "1) Girinti,Yorum ve Çok Satırlı İfadeler.md"
        - 2) Girdi ve Çıktı: "2) Girdi ve Çıktı.md"
        - 3) Değişkenler (Variables) ve Kapsam (Scope): "3) Değişkenler (Variables) ve Kapsam (Scope).md"
        - 4) Veri Türleri (Data Types) ve Tip Dönüşümleri (Type Casting): "4) Veri Türleri (Data Types) ve Tip Dönüşümleri (Type Casting).md"
        - 5) Python'da random Modülü: "5) Python'da random Modülü.md"
