        - 7) Operatörler: "7) Operatörler.md"
        - 8) Boole Değerleri ve Doğruluk Mantıkları: "8) Boole Değerleri ve Doğruluk Mantıkları.md"
        - 9.1) List (Liste): "9.1) Python Koleksiyonları - List (Liste).md"
        - 9.2) Tuple (Demet): "9.2) Python Koleksiyonları - Tuple (Demet).md"
        - 9.3) Set (Küme): "9.3) Python Koleksiyonları - Set (Küme).md"
        - 9.4) Dictionary (Sözlük): "9.4) Python Koleksiyonları - Dictionarie (Sözlük).md"
        - 10) if - else - elif (Koşul Durum İfadeleri): "10) if - else - elif (Koşul Durum İfadeleri).md"
