site_name: Python Materyalleri

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.footer

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Ana Sayfa: index.md
  - Python Ders Notları:
      - 1) Girinti, Yorum ve Çok Satırlı İfadeler: "1) Girinti,Yorum ve Çok Satırlı İfadeler.md"
      - 2) Girdi ve Çıktı: "2) Girdi ve Çıktı.md"
      - 3) Değişkenler (Variables) ve Kapsam (Scope): "3) Değişkenler (Variables) ve Kapsam (Scope).md"
      - 4) Veri Türleri (Data Types) ve Tip Dönüşümleri (Type Casting): "4) Veri Türleri (Data Types) ve Tip Dönüşümleri (Type Casting).md"
      - 5) Python'da random Modülü: "5) Python'da random Modülü.md"
      - 6) String (Dize - Dizgi - Karakter Dizisi): "6) String (Dize - Dizgi - Karakter Dizisi).md"
      - 7) Operatörler: "7) Operatörler.md"
      - 8) Boole Değerleri ve Doğruluk Mantıkları: "8) Boole Değerleri ve Doğruluk Mantıkları.md"
      - 9.1) List (Liste): "9.1) Python Koleksiyonları - List (Liste).md"
      - 9.2) Tuple (Demet): "9.2) Python Koleksiyonları - Tuple (Demet).md"
      - 9.3) Set (Küme): "9.3) Python Koleksiyonları - Set (Küme).md"
      - 9.4) Dictionary (Sözlük): "9.4) Python Koleksiyonları - Dictionarie (Sözlük).md"
